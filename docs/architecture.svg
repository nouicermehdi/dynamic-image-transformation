<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2430">Dynamic image transformation on CloudFront: API Gateway, Lambda + sharp, S3</text>

  <!-- AWS boundary -->
  <rect x="200" y="56" width="980" height="620" rx="12" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="214" y="78" font-size="13" fill="#666">AWS Cloud</text>

  <!-- X-Ray band -->
  <rect x="515" y="222" width="430" height="150" rx="10" fill="#fdf2f8" stroke="#E7157B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="527" y="241" font-size="12" fill="#B0105F" font-weight="700">AWS X-Ray traces API Gateway and Lambda</text>

  <!-- Users -->
  <rect x="20" y="270" width="140" height="80" rx="8" fill="#f2f4f7" stroke="#667085" stroke-width="1.5"/>
  <text x="90" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2430">Browsers / apps</text>
  <text x="90" y="325" text-anchor="middle" font-size="12" fill="#475467">img src="/cat.jpg?w=400"</text>

  <!-- CloudFront -->
  <rect x="240" y="260" width="170" height="100" rx="8" fill="#f3edff" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="325" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2430">CloudFront</text>
  <text x="325" y="308" text-anchor="middle" font-size="11" fill="#475467">Cache key: path + w,h,fit,fmt,q</text>
  <text x="325" y="324" text-anchor="middle" font-size="11" fill="#475467">Security headers, HTTPS only</text>
  <text x="325" y="340" text-anchor="middle" font-size="11" fill="#475467">Adds x-api-key to the origin call</text>

  <!-- CloudFront Function -->
  <rect x="240" y="110" width="170" height="80" rx="8" fill="#f3edff" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="325" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2430">CloudFront Function</text>
  <text x="325" y="158" text-anchor="middle" font-size="11" fill="#475467">Viewer request: Accept header</text>
  <text x="325" y="174" text-anchor="middle" font-size="11" fill="#475467">becomes fmt=avif or webp</text>

  <!-- API Gateway -->
  <rect x="530" y="260" width="170" height="100" rx="8" fill="#f3edff" stroke="#8C4FFF" stroke-width="1.5"/>
  <text x="615" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2430">API Gateway (REST)</text>
  <text x="615" y="308" text-anchor="middle" font-size="11" fill="#475467">API key required, throttling</text>
  <text x="615" y="324" text-anchor="middle" font-size="11" fill="#475467">Binary media types */*</text>
  <text x="615" y="340" text-anchor="middle" font-size="11" fill="#475467">Direct URL returns 403</text>

  <!-- Lambda -->
  <rect x="770" y="260" width="160" height="100" rx="8" fill="#fff1e6" stroke="#ED7100" stroke-width="1.5"/>
  <text x="850" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2430">Lambda + sharp</text>
  <text x="850" y="308" text-anchor="middle" font-size="11" fill="#475467">Node.js 20, arm64, 1.5 GB</text>
  <text x="850" y="324" text-anchor="middle" font-size="11" fill="#475467">Validate, resize, convert</text>
  <text x="850" y="340" text-anchor="middle" font-size="11" fill="#475467">Least-privilege IAM role</text>

  <!-- Source bucket -->
  <rect x="1000" y="170" width="160" height="80" rx="8" fill="#eef7e9" stroke="#3F8624" stroke-width="1.5"/>
  <text x="1080" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2430">S3 source bucket</text>
  <text x="1080" y="216" text-anchor="middle" font-size="11" fill="#475467">Original images</text>
  <text x="1080" y="232" text-anchor="middle" font-size="11" fill="#475467">Private, encrypted (read-only)</text>

  <!-- Derived bucket -->
  <rect x="1000" y="370" width="160" height="80" rx="8" fill="#eef7e9" stroke="#3F8624" stroke-width="1.5"/>
  <text x="1080" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2430">S3 derived bucket</text>
  <text x="1080" y="416" text-anchor="middle" font-size="11" fill="#475467">Generated results</text>
  <text x="1080" y="432" text-anchor="middle" font-size="11" fill="#475467">Lifecycle expiry (30 days)</text>

  <!-- Secrets Manager -->
  <rect x="530" y="470" width="170" height="80" rx="8" fill="#fdecee" stroke="#DD344C" stroke-width="1.5"/>
  <text x="615" y="498" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2430">Secrets Manager</text>
  <text x="615" y="516" text-anchor="middle" font-size="11" fill="#475467">Generated API key shared by</text>
  <text x="615" y="532" text-anchor="middle" font-size="11" fill="#475467">CloudFront and API Gateway</text>

  <!-- CloudWatch -->
  <rect x="770" y="470" width="160" height="80" rx="8" fill="#fdf2f8" stroke="#E7157B" stroke-width="1.5"/>
  <text x="850" y="498" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2430">CloudWatch</text>
  <text x="850" y="516" text-anchor="middle" font-size="11" fill="#475467">Logs, metrics, alarms</text>

  <!-- SNS -->
  <rect x="770" y="590" width="160" height="70" rx="8" fill="#fdf2f8" stroke="#E7157B" stroke-width="1.5"/>
  <text x="850" y="618" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2430">SNS topic</text>
  <text x="850" y="636" text-anchor="middle" font-size="11" fill="#475467">Email alerts</text>

  <!-- Arrows -->
  <g stroke="#444" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M160,310 H240"/>
    <path d="M325,260 V190" marker-start="url(#arrow)"/>
    <path d="M410,310 H530"/>
    <path d="M700,310 H770"/>
    <path d="M930,285 H965 V210 H1000"/>
    <path d="M930,335 H965 V410 H1000" marker-start="url(#arrow)"/>
    <path d="M850,360 V470"/>
    <path d="M850,550 V590"/>
  </g>
  <path d="M615,470 V360" stroke="#444" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <path d="M530,510 H325 V360" stroke="#444" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="200" y="302" text-anchor="middle" font-size="11" fill="#333">HTTPS</text>
  <text x="333" y="230" font-size="11" fill="#333">viewer request</text>
  <text x="470" y="302" text-anchor="middle" font-size="11" fill="#333">cache miss only</text>
  <text x="735" y="302" text-anchor="middle" font-size="11" fill="#333">proxy</text>
  <text x="975" y="190" text-anchor="middle" font-size="11" fill="#333">1. GetObject</text>
  <text x="930" y="392" text-anchor="middle" font-size="11" fill="#333">check / store result</text>
  <text x="858" y="420" font-size="11" fill="#333">logs</text>
  <text x="858" y="574" font-size="11" fill="#333">alarm</text>
  <text x="622" y="420" font-size="11" fill="#333">key check</text>
  <text x="430" y="502" font-size="11" fill="#333">key value in origin header</text>

  <!-- Legend -->
  <g font-size="12" fill="#333">
    <text x="20" y="560" font-weight="700">Legend</text>
    <line x1="20" y1="578" x2="60" y2="578" stroke="#444" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="70" y="582">Request / data flow</text>
    <line x1="20" y1="600" x2="60" y2="600" stroke="#444" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="70" y="604">Shared secret</text>
    <rect x="20" y="614" width="40" height="16" fill="#fdf2f8" stroke="#E7157B" stroke-dasharray="4 3"/>
    <text x="70" y="627">Traced by X-Ray</text>
  </g>
</svg>
