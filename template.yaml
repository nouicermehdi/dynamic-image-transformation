AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Dynamic image transformation on CloudFront: resize, crop and convert images on the
  fly from a private S3 bucket. CloudFront (with a viewer-request Function) -> API Gateway
  (API key) -> Lambda + sharp -> S3 source and derived-results buckets.

Parameters:
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address that receives CloudWatch alarm notifications.
  CacheTtlSeconds:
    Type: Number
    Default: 86400
    MinValue: 60
    MaxValue: 31536000
    Description: How long CloudFront and browsers may cache a transformed image.
  DerivedRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Days before generated images in the derived bucket are deleted by the S3 lifecycle rule.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ------------------------------------------------------------------
  # Storage
  # ------------------------------------------------------------------
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SourceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt SourceBucket.Arn
              - !Sub ${SourceBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Generated images. Safe to delete at any time: they are rebuilt on demand.
  DerivedBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpireGeneratedImages
            Status: Enabled
            ExpirationInDays: !Ref DerivedRetentionDays
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  DerivedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DerivedBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DerivedBucket.Arn
              - !Sub ${DerivedBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ------------------------------------------------------------------
  # Shared secret: CloudFront sends it to API Gateway so the raw API URL
  # cannot be used to bypass the CDN. Generated by Secrets Manager.
  # ------------------------------------------------------------------
  OriginKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: API key that CloudFront sends to API Gateway in the x-api-key header
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: key
        PasswordLength: 40
        ExcludePunctuation: true

  # ------------------------------------------------------------------
  # Compute
  # ------------------------------------------------------------------
  TransformLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-transform
      RetentionInDays: 14

  TransformFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub ${AWS::StackName}-transform
      Description: Resizes and converts images with sharp
      CodeUri: src/transform/
      Handler: app.handler
      Runtime: nodejs20.x
      Architectures: [arm64]
      MemorySize: 1536
      Timeout: 20
      Tracing: Active
      Environment:
        Variables:
          SOURCE_BUCKET: !Ref SourceBucket
          DERIVED_BUCKET: !Ref DerivedBucket
          BROWSER_CACHE_SECONDS: !Ref CacheTtlSeconds
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref SourceBucket
        - S3CrudPolicy:
            BucketName: !Ref DerivedBucket
      LoggingConfig:
        LogGroup: !Ref TransformLogGroup
      Events:
        GetImage:
          Type: Api
          Properties:
            RestApiId: !Ref ImageApi
            Path: /{key+}
            Method: ANY

  # ------------------------------------------------------------------
  # API Gateway: only callable with the API key held by CloudFront
  # ------------------------------------------------------------------
  ImageApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api
      StageName: prod
      TracingEnabled: true
      EndpointConfiguration:
        Type: REGIONAL
      BinaryMediaTypes:
        - "*~1*" # SAM spelling of */*: lets API Gateway return raw image bytes
      Auth:
        ApiKeyRequired: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200
          MetricsEnabled: true

  OriginApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true
      Value: !Sub "{{resolve:secretsmanager:${OriginKeySecret}:SecretString:key}}"

  OriginUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ImageApiprodStage
    Properties:
      UsagePlanName: !Sub ${AWS::StackName}-cloudfront
      ApiStages:
        - ApiId: !Ref ImageApi
          Stage: prod
      Throttle:
        RateLimit: 100
        BurstLimit: 200

  OriginUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref OriginApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref OriginUsagePlan

  # ------------------------------------------------------------------
  # CloudFront: cache key = path + the five transformation parameters.
  # The Function turns the Accept header into an fmt value so that browsers
  # get AVIF/WebP automatically without Accept being part of the cache key.
  # ------------------------------------------------------------------
  ViewerRequestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-negotiate-format
      AutoPublish: true
      FunctionConfig:
        Comment: Pick avif or webp from the Accept header when fmt is not set
        Runtime: cloudfront-js-2.0
      # BEGIN edge-function
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var accept = (request.headers.accept && request.headers.accept.value) || '';
          if (!request.querystring.fmt) {
            if (accept.indexOf('image/avif') !== -1) {
              request.querystring.fmt = { value: 'avif' };
            } else if (accept.indexOf('image/webp') !== -1) {
              request.querystring.fmt = { value: 'webp' };
            }
          }
          return request;
        }
      # END edge-function

  ImageCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-image-params
        Comment: Cache key is the path plus w, h, fit, fmt and q only
        MinTTL: 1
        DefaultTTL: !Ref CacheTtlSeconds
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig:
            HeaderBehavior: none
          CookiesConfig:
            CookieBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: whitelist
            QueryStrings: [w, h, fit, fmt, q]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} image transformation
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: image-api
            DomainName: !Sub ${ImageApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            OriginPath: /prod
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: x-api-key
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginKeySecret}:SecretString:key}}"
        DefaultCacheBehavior:
          TargetOriginId: image-api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: false # images are already compressed
          CachePolicyId: !Ref ImageCachePolicy
          # Managed SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN

  # ------------------------------------------------------------------
  # Monitoring
  # ------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-lambda-errors
      AlarmDescription: The transform function reported invocation errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref TransformFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  LambdaSlowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-lambda-slow
      AlarmDescription: p95 transformation time is close to the function timeout
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - { Name: FunctionName, Value: !Ref TransformFunction }
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 15000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-5xx
      AlarmDescription: API Gateway returned 5XX errors
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - { Name: ApiName, Value: !Sub "${AWS::StackName}-api" }
        - { Name: Stage, Value: prod }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  ImageBaseUrl:
    Description: Base URL. Append /<key>?w=400 to request an image.
    Value: !Sub https://${Distribution.DomainName}
  SourceBucketName:
    Description: Upload original images here
    Value: !Ref SourceBucket
  DerivedBucketName:
    Description: Generated images (lifecycle-expired)
    Value: !Ref DerivedBucket
  DistributionId:
    Value: !Ref Distribution
  OriginKeySecretArn:
    Description: Secret holding the API key shared by CloudFront and API Gateway
    Value: !Ref OriginKeySecret
